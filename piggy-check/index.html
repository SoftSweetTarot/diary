<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff8fb1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="저금 확인">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>저금 확인 · 말랑달콤</title>
<!-- 말랑달콤 다이어리 - piggy-check/index.html
     📱 저금 확인 앱 (주인 전용) : 휴대폰에서 저금 코드를 찾아 버튼 하나로 '저금 확인' (시트에서 ☑ 체크한 것과 똑같아요)
     - 서버 : 말랑달콤사람들_앱스크립트.gs (admin_find · admin_save) · 관리 열쇠가 맞아야만 동작 (처음 한 번 setupAdmin 실행 → 열쇠를 여기에 넣기)
     - 확실하게 : 요청마다 번호를 붙여 보내요 → 인터넷이 끊겨 다시 보내도 한 번만 처리
                  처리된 뒤 시트를 다시 읽어서 🎀 · 🍬 전체 끝나는 날 · 저금 횟수가 맞는지 확인 → 맞으면 '저금 확인 완료' 창
     - 맨 위 탭 3개 : 💗 저금 확인 · 🎁 아이템 주기 · 🖼️ 배경화면 주기 (같은 저금 코드 검색을 쓰고, 탭마다 그 일만 보여요)
     - 🎁 아이템 주기 : 🪙 코인 · 🎀 마스킹테이프 · 🍬 달콤패턴(전체 또는 디자인 하나하나 + 기간) · 🎁 캡슐 스티커(여러 개 + 기간) (admin_give · 확인 창 → 보내기 → 결과 창)
     - 🖼️ 배경화면 주기 : 번호로 골라서 · 드라이브 폴더 링크가 자동으로 전해져요 (admin_give · walls)
     - 기간은 '원래 남은 기간 + 새 기간'으로 더해져요 · 결과 창에 '원래 D-15 + 30일 = D-45' 로 보여 줘요
     - 놓치지 않게 : 보내기 전에 이 휴대폰에 '보내는 중'을 적어 두고 · 결과 창이 뜰 때까지 지우지 않아요 (앱이 닫혀도 다시 열면 '이어서 확인하기' 창이 떠요 · 같은 요청 번호라 두 번 들어가지 않아요)
                  카드의 '📬 알림 대기'는 받는 분이 아직 도착 창을 안 본 상태예요 (다이어리를 열면 떠요)
     - 📲 홈 화면에 설치 : 맨 위 하트 로고를 5번 톡톡 누르면 숨은 설치 칸이 열려요
     - 다이어리 어디에도 이 주소는 없어요 (softsweetdiary.com/piggy-check/) · 검색에도 안 나와요 -->
<style>
    :root { --pink: #ff6b93; --deep: #c2456f; --soft: #fff0f5; --line: #ffd1df; --text: #5a4650; --sub: #8c6f7c; --ok: #2fa66b; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body { min-height: 100vh; background: linear-gradient(180deg, #ffe3ec, #fff6f9 40%); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; word-break: keep-all; }
    .wrap { max-width: 460px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 40px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 44px; height: 44px; border-radius: 14px; box-shadow: 0 3px 10px rgba(255, 107, 147, .3); user-select: none; -webkit-user-select: none; cursor: pointer; }
    .top h1 { margin: 0; font-size: 20px; color: var(--deep); }
    .top small { display: block; font-size: 12px; color: var(--sub); font-weight: normal; }
    .card { background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 3px 14px rgba(255, 120, 160, .14); margin-bottom: 12px; }
    .card[hidden], [hidden] { display: none !important; }
    label.t { display: block; font-weight: bold; color: var(--deep); margin-bottom: 8px; font-size: 14px; }
    .search { display: flex; align-items: center; gap: 6px; border: 2.5px solid var(--line); border-radius: 16px; padding: 4px 6px 4px 12px; background: #fff; }
    .search:focus-within { border-color: var(--pink); }
    .search b { color: var(--sub); font-size: 18px; }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: 22px; font-weight: bold; letter-spacing: .06em; padding: 8px 0; color: var(--text); background: none; text-transform: uppercase; font-family: inherit; }
    .search button { border: 0; background: var(--soft); color: var(--sub); border-radius: 10px; font-size: 16px; width: 36px; height: 36px; }
    .hint { font-size: 12.5px; color: var(--sub); margin: 8px 2px 0; }
    .state { text-align: center; color: var(--sub); font-size: 14px; padding: 18px 8px; }
    .m { border: 2px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 10px; background: #fffafc; }
    .m-code { font-size: 24px; font-weight: 900; color: var(--deep); letter-spacing: .04em; }
    .m-rows { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 10px 0 12px; font-size: 13.5px; }
    .m-rows dt { color: var(--sub); }
    .m-rows dd { margin: 0; font-weight: bold; }
    .m-rows dd.on { color: var(--ok); }
    .btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 16px; padding: 15px; font-size: 18px; font-weight: 900; font-family: inherit; color: #fff; background: linear-gradient(160deg, #ff8fb1, var(--pink)); box-shadow: 0 5px 14px rgba(255, 107, 147, .35); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .55; box-shadow: none; }
    .btn.done { background: linear-gradient(160deg, #6fd39f, var(--ok)); box-shadow: 0 5px 14px rgba(47, 166, 107, .3); opacity: 1; }
    .btn.sub { background: #fff; color: var(--deep); border: 2px solid var(--line); box-shadow: none; font-size: 15px; padding: 11px; }
    .spin { width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, .5); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .key input { width: 100%; border: 2.5px solid var(--line); border-radius: 14px; padding: 12px; font-size: 16px; font-family: inherit; margin-bottom: 10px; }
    .err { color: #d6336c; font-size: 13px; margin: 0 0 10px; }
    .foot { text-align: center; margin-top: 18px; font-size: 12px; color: var(--sub); }
    .foot button { border: 0; background: none; color: var(--sub); text-decoration: underline; font-family: inherit; font-size: 12px; }
    .install p { font-size: 13.5px; line-height: 1.6; margin: 0 0 10px; }
    .install ol { margin: 0 0 10px; padding-left: 20px; font-size: 13.5px; line-height: 1.7; }
    .btn.gift { margin-top: 8px; background: linear-gradient(160deg, #b79bff, #8f6bf0); box-shadow: 0 5px 14px rgba(143, 107, 240, .3); }
    /* 🎁 아이템 주기 창 */
    .pop-box.wide { width: min(400px, 100%); max-height: 92vh; overflow-y: auto; text-align: left; padding: 20px 16px 16px; }
    .g-who { text-align: center; font-size: 13px; color: var(--sub); margin-bottom: 10px; }
    .g-who b { display: block; font-size: 22px; color: var(--deep); letter-spacing: .04em; }
    .g-row { border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; background: #fffafc; }
    .g-row h4 { margin: 0 0 8px; font-size: 14px; color: var(--deep); }
    .g-row h4 small { font-weight: normal; color: var(--sub); font-size: 12px; }
    .g-num { display: flex; align-items: center; gap: 8px; }
    .g-num input { width: 84px; border: 2.5px solid var(--line); border-radius: 12px; padding: 9px 8px; font-size: 18px; font-weight: bold; text-align: center; font-family: inherit; color: var(--text); }
    .g-num input:focus { outline: 0; border-color: var(--pink); }
    .g-num span { font-size: 14px; color: var(--sub); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { border: 2px solid var(--line); background: #fff; color: var(--sub); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-family: inherit; }
    .chip.on { border-color: var(--pink); background: var(--soft); color: var(--deep); font-weight: bold; }
    .chip.st { border-radius: 12px; }
    .chip.own { border-style: dashed; }
    .g-sum { background: var(--soft); border-radius: 14px; padding: 10px; font-size: 14px; line-height: 1.7; margin: 4px 0 12px; }
    .g-sum b { color: var(--deep); }
    /* 결과 창 (닫기를 눌러야 닫혀요) */
    .pop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(90, 40, 60, .4); }
    .pop-box { width: min(340px, 100%); background: #fff; border-radius: 26px; padding: 26px 20px 18px; text-align: center; animation: pin .35s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes pin { from { transform: scale(.7); opacity: 0; } }
    .pop-ic { width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 40px; color: #fff; background: var(--ok); box-shadow: 0 6px 18px rgba(47, 166, 107, .35); }
    .pop-ic.bad { background: #ff9f43; box-shadow: 0 6px 18px rgba(255, 159, 67, .35); }
    .pop-t { font-size: 21px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
    .pop-s { font-size: 14px; color: var(--sub); line-height: 1.6; margin-bottom: 14px; }
    .pop-d { background: var(--soft); border-radius: 14px; padding: 10px; font-size: 14px; line-height: 1.7; margin-bottom: 14px; }
    .pop-d b { color: var(--deep); }
    .pop-btns { display: grid; gap: 8px; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .tab { border: 2px solid var(--line); background: #fff; color: var(--sub); border-radius: 14px; padding: 10px 2px; font-size: 13px; font-weight: bold; font-family: inherit; line-height: 1.3; }
    .tab.on { border-color: var(--pink); background: var(--soft); color: var(--deep); box-shadow: 0 3px 10px rgba(255, 107, 147, .2); }
    .m-rows dd.wait { color: #d98a00; }
    .add { display: block; font-size: 12.5px; color: var(--sub); font-weight: normal; }
    .add b { color: var(--deep); }
    .btn.wall { background: linear-gradient(160deg, #7ec8ff, #4aa3ee); box-shadow: 0 5px 14px rgba(74, 163, 238, .3); }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <img class="logo" id="logo" src="icon-192.png" alt="">
        <h1>저금 확인 <small>말랑달콤 저금통 · 주인 전용</small></h1>
    </div>

    <!-- 📲 홈 화면에 설치 (로고를 5번 누르면 열려요) -->
    <div class="card install" id="install" hidden>
        <label class="t">📲 홈 화면에 앱 아이콘 만들기</label>
        <div id="installBody"></div>
        <button class="btn sub" type="button" onclick="document.getElementById('install').hidden = true">접기</button>
    </div>

    <!-- 🔑 관리 열쇠 (처음 한 번) -->
    <div class="card key" id="keyCard" hidden>
        <label class="t">🔑 관리 열쇠</label>
        <p class="hint" style="margin:0 0 10px">앱스크립트에서 <b>setupAdmin</b> 을 실행하면 '실행 로그'에 나와요. 한 번만 넣으면 이 휴대폰이 기억해요.</p>
        <input id="keyIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="관리 열쇠 붙여 넣기">
        <p class="err" id="keyErr" hidden></p>
        <button class="btn" id="keyBtn" type="button" onclick="keySave()">열쇠 넣기</button>
    </div>

    <!-- 💗 저금 확인 · 🎁 아이템 주기 · 🖼️ 배경화면 주기 -->
    <div class="tabs" id="tabs" hidden>
        <button type="button" class="tab" data-t="save" onclick="tabSet('save')">💗<br>저금 확인</button>
        <button type="button" class="tab" data-t="give" onclick="tabSet('give')">🎁<br>아이템 주기</button>
        <button type="button" class="tab" data-t="wall" onclick="tabSet('wall')">🖼️<br>배경화면 주기</button>
    </div>

    <!-- 🔍 저금 코드 찾기 -->
    <div class="card" id="main" hidden>
        <label class="t" for="q" id="tabTitle">💗 저금 코드</label>
        <div class="search">
            <b>말랑</b>
            <input id="q" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" oninput="onType()">
            <button type="button" onclick="clearQ()" aria-label="지우기">✕</button>
        </div>
        <p class="hint" id="tabHint">채팅에 온 저금 코드를 적으면 바로 찾아요 (말랑은 빼고 적어도 돼요)</p>
        <div id="list"></div>
    </div>

    <div class="foot" id="foot" hidden><button type="button" onclick="keyReset()">🔑 열쇠 다시 넣기</button></div>
</div>
<div class="pop" id="pop" hidden></div>

<script>
    const API = 'https://script.google.com/macros/s/AKfycbzuhJ24tR7VbfKfX-lGI8-BRpPDx3d_J0UwR9x94RxPd2H3mvJiea-vn7EvRRCt2IgMag/exec';   // '말랑달콤 사람들' 서버 (다이어리 js/presence.js 의 MEMBER_API_URL 과 같아요)
    const KEY_LOCAL = 'pc_key';
    const $ = id => document.getElementById(id);
    const st = { key: '', list: [], t: 0, seq: 0, busy: '', tab: 'save' };
    const TAB_LOCAL = 'pc_tab', PEND = 'pc_pending';
    try { st.key = localStorage.getItem(KEY_LOCAL) || ''; st.tab = ['save', 'give', 'wall'].includes(localStorage.getItem(TAB_LOCAL)) ? localStorage.getItem(TAB_LOCAL) : 'save'; } catch (e) {}

    /* 서버에 보내기 (끊기면 몇 번 더 · 같은 내용을 다시 보내도 안전한 것만) */
    async function api(body, tries, ms) {
        let last = { ok: false, error: 'network' };
        for (let i = 0; i < (tries || 1); i++) {
            if (i) await new Promise(r => setTimeout(r, 1200 * i));
            try {
                const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 20000);
                const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ key: st.key }, body)), signal: ctl.signal });
                clearTimeout(tm);
                last = await res.json();
                if (last && (last.ok || last.error !== 'server')) return last;
            } catch (e) { last = { ok: false, error: 'network' }; }
        }
        return last;
    }
    const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const dLeft = d => { if (!d) return ''; const n = Math.round((new Date(d + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000); return n > 0 ? 'D-' + n : 'D-day'; };
    const nameOf = (list, id) => (list.find(x => x[0] === id) || [id, id])[1];
    const passRows = (all, one, list) => [all ? `🌈 전체 ${esc(all)}까지 (${dLeft(all)})` : '']          // 전체 + 디자인별 끝나는 날 (한 줄씩)
        .concat(Object.keys(one || {}).map(id => `${esc(nameOf(list, id))} ${esc(one[id])}까지 (${dLeft(one[id])})`)).filter(Boolean).join('<br>');
    const md = d => { const x = new Date(d + 'T00:00:00'); return `${x.getFullYear()}년 ${x.getMonth() + 1}월 ${x.getDate()}일`; };

    const TAB_INFO = {
        save: ['💗 저금 코드', '채팅에 온 저금 코드를 적으면 바로 찾아요 (말랑은 빼고 적어도 돼요)'],
        give: ['🎁 아이템 받을 사람의 저금 코드', '🪙 코인 · 🎀 · 🍬 · 🎁 스티커를 줄 사람의 저금 코드를 적어 주세요'],
        wall: ['🖼️ 배경화면 받을 사람의 저금 코드', '채팅에 온 \'배경화면 N번 말랑XXXX\' 의 저금 코드를 적어 주세요']
    };
    function tabSet(t) {
        st.tab = t; try { localStorage.setItem(TAB_LOCAL, t); } catch (e) {}
        tabUi();
        if (st.list.length) render();
    }
    function tabUi() {
        document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.t === st.tab));
        $('tabTitle').textContent = TAB_INFO[st.tab][0]; $('tabHint').textContent = TAB_INFO[st.tab][1];
    }
    /* 🛟 보내는 중 기록 (결과 창이 뜰 때까지 지우지 않아요 → 앱이 닫혀도 이어서 확인) */
    const pendSet = x => { try { localStorage.setItem(PEND, JSON.stringify(Object.assign({ at: Date.now() }, x))); } catch (e) {} };
    const pendClear = () => { try { localStorage.removeItem(PEND); } catch (e) {} };
    const pendGet = () => { try { const x = JSON.parse(localStorage.getItem(PEND)); return x && x.code && Date.now() - x.at < 6 * 3600000 ? x : null; } catch (e) { return null; } };   // 서버가 같은 요청을 기억하는 6시간 안에서만

    /* ---------- 🔑 열쇠 ---------- */
    function showMain() {
        $('keyCard').hidden = !!st.key; $('main').hidden = !st.key; $('foot').hidden = !st.key; $('tabs').hidden = !st.key;
        tabUi();
        if (st.key) { setTimeout(() => $('q').focus(), 50); resumeCheck(); }
    }
    async function keySave() {
        const k = $('keyIn').value.trim(); if (!k) return;
        const b = $('keyBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span> 확인 중…'; $('keyErr').hidden = true;
        const old = st.key; st.key = k;
        const r = await api({ action: 'admin_hello' }, 3);
        b.disabled = false; b.textContent = '열쇠 넣기';
        if (r.ok) { try { localStorage.setItem(KEY_LOCAL, k); } catch (e) {} showMain(); return; }
        st.key = old;
        $('keyErr').textContent = r.error === 'key' ? '열쇠가 맞지 않아요. 다시 확인해 주세요.' : '서버에 연결하지 못했어요. 인터넷을 확인해 주세요.';
        $('keyErr').hidden = false;
    }
    function keyReset() { st.key = ''; try { localStorage.removeItem(KEY_LOCAL); } catch (e) {} $('keyIn').value = ''; showMain(); }

    /* ---------- 🔍 찾기 (적는 동안 0.4초 쉬면 찾아요) ---------- */
    const norm = v => v.replace(/^말랑/, '').replace(/\s/g, '').toUpperCase();
    function onType() {
        clearTimeout(st.t);
        const q = norm($('q').value);
        if (q.length < 2) { $('list').innerHTML = q ? '<div class="state">두 글자 이상 적어 주세요</div>' : ''; return; }
        st.t = setTimeout(() => find(q), 400);
    }
    function clearQ() { $('q').value = ''; $('list').innerHTML = ''; $('q').focus(); }
    async function find(q) {
        const my = ++st.seq;
        $('list').innerHTML = '<div class="state">🔍 찾는 중…</div>';
        const r = await api({ action: 'admin_find', q }, 2);
        if (my !== st.seq) return;                                   // 그 사이 더 적었으면 버려요
        if (!r.ok) { $('list').innerHTML = `<div class="state">${r.error === 'key' ? '🔑 열쇠가 맞지 않아요' : '📶 서버에 연결하지 못했어요. 다시 적어 보세요'}</div>`; if (r.error === 'key') keyReset(); return; }
        st.list = r.list || [];
        render();
    }
    function render() {
        const wait = m => m.pending ? '<dt>📬 알림</dt><dd class="wait">받는 분이 아직 안 봤어요 · 다이어리를 열면 떠요</dd>' : '';
        const rows = (m, tab) => tab === 'wall' ? `
              <dt>🖼️ 배경화면</dt><dd class="${(m.walls || []).length ? 'on' : ''}">${(m.walls || []).length ? m.walls.map(n => esc(wallLabel(n))).join('<br>') : '없음'}</dd>${wait(m)}
              <dt>마지막 접속</dt><dd>${esc(m.last || '-')} ${esc(m.dev || '')}</dd>` : `
              <dt>🎀 테이프</dt><dd class="${passRows(m.tape, m.tp, TAPES) ? 'on' : ''}">${passRows(m.tape, m.tp, TAPES) || '없음'}</dd>
              <dt>🍬 패턴</dt><dd class="${passRows(m.pat, m.pp, PATS) ? 'on' : ''}">${passRows(m.pat, m.pp, PATS) || '없음'}</dd>${wait(m)}
              ${tab === 'save' ? `<dt>저금</dt><dd>${m.count}번</dd>` : ''}
              <dt>마지막 접속</dt><dd>${esc(m.last || '-')} ${esc(m.dev || '')}</dd>`;
        const btns = (m, i) => st.tab === 'save' ? (m.done ? `<button class="btn done" type="button" disabled>✅ 방금 저금 확인했어요</button>` : `<button class="btn" type="button" id="sv${i}" onclick="save(${i})">💗 저금 확인</button>`)
            : st.tab === 'give' ? `<button class="btn gift" type="button" onclick="giveOpen(${i}, 'item')">🎁 아이템 주기</button>`
            : `<button class="btn wall" type="button" onclick="giveOpen(${i}, 'wall')">🖼️ 배경화면 주기</button>`;
        $('list').innerHTML = st.list.length ? st.list.map((m, i) => `
          <div class="m">
            <div class="m-code">${esc(m.code)}</div>
            <dl class="m-rows">${rows(m, st.tab)}</dl>
            ${btns(m, i)}
          </div>`).join('') : '<div class="state">🙈 그런 저금 코드가 없어요</div>';
    }
    /* '원래 D-15 + 30일 = D-45' (없던 거면 '30일 새로 열렸어요') */
    const addLine = (from, add, until) => !add ? '' : from ? `<span class="add">원래 <b>${dLeft(from)}</b> + <b>${add}일</b> = <b>${dLeft(until)}</b></span>` : `<span class="add"><b>${add}일</b> 새로 열렸어요</span>`;
    const SENT = '📬 받는 분이 다이어리를 열면 알림 창이 떠요 (안 쓰고 있어도 서버에 안전하게 남아 있다가 접속하면 떠요)';

    /* ---------- 💗 저금 확인 : 보내기 → 시트를 다시 읽어서 맞는지 확인 → 완료 창 ---------- */
    function save(i, rid) { const m = st.list[i]; if (m) saveCode(m.code, rid); }
    async function saveCode(code, rid) {
        if (!code || st.busy) return;
        rid = rid || (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
        st.busy = rid;
        const i = st.list.findIndex(x => x.code === code), b = $('sv' + i);
        if (b) { b.disabled = true; b.innerHTML = '<span class="spin"></span> 저금 확인 중…'; }
        pendSet({ kind: 'save', code, rid });                                          // 결과 창이 뜰 때까지 지우지 않아요
        let ok = false, now = null, r = { ok: false, error: 'network' };
        try {
            r = await api({ action: 'admin_save', code, rid }, 4);                       // 같은 번호(rid)라 몇 번 보내도 한 번만 처리돼요
            if (r.ok) {
                if (b) b.innerHTML = '<span class="spin"></span> 시트에 잘 적혔는지 확인 중…';
                const f = await api({ action: 'admin_find', q: code }, 4);
                now = f.ok ? (f.list || []).find(x => x.code === code) : null;
                ok = !!now && now.tape === r.tape && now.pat === r.pat && now.count === r.count;
            }
        } catch (e) { ok = false; }
        st.busy = '';
        if (ok || r.error === 'none' || r.error === 'key') pendClear();                 // 처리됐거나 처리될 수 없는 건 기록을 지워요 · 불안한 건 남겨 둬요 (다시 시도 · 이어서 확인)
        try {
            if (ok) { const k = st.list.findIndex(x => x.code === code); if (k >= 0) st.list[k] = Object.assign({}, now, { done: true }); render(); popOk(r); }
            else { if (b) { b.disabled = false; b.textContent = '💗 저금 확인'; } popBad(code, rid, r); }
        } catch (e) { pop('<div class="pop-ic bad">!</div><div class="pop-t">결과를 보여 주지 못했어요</div><div class="pop-s">앱을 다시 열면 \'이어서 확인하기\' 창이 떠요.</div><div class="pop-btns"><button class="btn sub" type="button" onclick="unpop()">닫기</button></div>'); }
    }
    function popOk(r) {
        pop(`<div class="pop-ic">✓</div>
          <div class="pop-t">저금 확인 완료!</div>
          <div class="pop-s">시트에 잘 적힌 것까지 확인했어요 💕</div>
          <div class="pop-d"><b>${esc(r.code)}</b><br>🎀 마스킹테이프 전체 <b>${md(r.tape)}</b>까지 (${dLeft(r.tape)})${addLine(r.tfrom, r.add, r.tape)}<br>🍬 달콤패턴 전체 <b>${md(r.pat)}</b>까지 (${dLeft(r.pat)})${addLine(r.pfrom, r.add, r.pat)}<br>${r.count}번째 저금</div>
          <div class="pop-s" style="font-size:12.5px">${SENT}</div>
          <div class="pop-btns"><button class="btn" type="button" onclick="unpop()">닫기</button></div>`);
    }
    function popBad(code, rid, r) {
        const why = !r.ok && r.error === 'key' ? '관리 열쇠가 맞지 않아요.' : !r.ok && r.error === 'none' ? '그 저금 코드를 시트에서 찾지 못했어요.'
            : r.ok ? '저금 확인은 보냈는데, 시트에서 확인하지 못했어요.' : '인터넷이 불안해서 서버에 닿지 못했어요.';
        st.retry = { code, rid };
        pop(`<div class="pop-ic bad">!</div>
          <div class="pop-t">아직 확인되지 않았어요</div>
          <div class="pop-s">${why}<br><b>다시 시도</b>를 눌러 주세요.<br><small>같은 요청으로 다시 보내서, 여러 번 눌러도 30일이 두 번 늘지 않아요.</small></div>
          <div class="pop-btns">${r.error === 'none' || r.error === 'key' ? '' : '<button class="btn" type="button" onclick="retry()">다시 시도</button>'}
            <button class="btn sub" type="button" onclick="unpop()">닫기</button></div>`);
    }
    function retry() { const x = st.retry; unpop(); if (x) saveCode(x.code, x.rid); }
    function pop(html) { $('pop').innerHTML = `<div class="pop-box">${html}</div>`; $('pop').hidden = false; }
    function unpop() { $('pop').hidden = true; $('pop').innerHTML = ''; }

    /* ---------- 🛟 앱이 닫혔다 열렸을 때 : 끝나지 않은 보내기가 있으면 이어서 확인 ---------- */
    function resumeCheck() {
        const p = pendGet(); if (!p || !st.key || !$('pop').hidden) return;
        pop(`<div class="pop-ic bad">!</div><div class="pop-t">끝나지 않은 ${p.kind === 'save' ? '저금 확인' : '선물'}이 있어요</div>
          <div class="pop-s"><b>${esc(p.code)}</b> 에게 보내던 중에 앱이 닫혔어요.<br>다시 확인하면 이미 들어간 건 두 번 들어가지 않아요.</div>
          <div class="pop-btns"><button class="btn" type="button" onclick="resumeGo()">이어서 확인하기</button>
            <button class="btn sub" type="button" onclick="resumeDrop()">지우기 (보내지 않았어요)</button></div>`);
    }
    function resumeGo() {
        const p = pendGet(); unpop(); if (!p) return;
        if (p.kind === 'save') return saveCode(p.code, p.rid);
        if (p.gv) { Object.assign(gv, p.gv, { busy: false }); giveSend(); }
    }
    function resumeDrop() { pendClear(); unpop(); }

    /* ---------- 🎁 아이템 주기 · 🖼️ 배경화면 주기 : 고르기 → 확인 → 보내기 → 결과 ---------- */
    const STICKERS = [['s3', '튤립 속 아기 토끼'], ['s7', '벚꽃 고양이'], ['s15', '꽃바구니 곰돌이'], ['s30', '딸기모자 햄스터'], ['s50', '꽃 양'],
        ['s100', '꽃 화관 토끼 공주'], ['c7', '방긋 해바라기'], ['c14', '무지개 구름이'], ['c21', '하트 풍선 병아리'], ['cfull', '딸기 케이크']];
    const TAPES = [['dot', '딸기우유 도트'], ['mint', '민트 사선'], ['gingham', '라벤더 깅엄'], ['heart', '레몬 하트'], ['cloud', '하늘 구름'], ['flower', '복숭아 꽃'], ['star', '밤하늘 별'], ['cherry', '체리 체리'], ['wave', '바다 물결'], ['rainbow', '무지개 줄무늬'], ['stripe', '캔디 줄무늬'], ['kraft', '크라프트 바느질'], ['grid', '모눈 투명'], ['lace', '화이트 레이스'], ['love', '러블리 글씨'], ['coral', '코랄 단색']];      // js/tape.js 의 TAPES (id · 이름)
    const PATS = [['flower-gingham', '블루 플라워 깅엄'], ['tomato', '토마토 피크닉'], ['tea-quilt', '찻잔 퀼트'], ['meadow', '물망초 들판']];      // js/patterns.js 의 달콤패턴(tier 'paid') (id · 이름)
    const DAY_CHIPS = [7, 14, 30, 60, 90];
    const gv = { i: -1, code: '', mode: 'item', coins: 0, tsel: [], tdays: 30, psel: [], pdays: 30, sdays: 30, sel: [], wsel: [], rid: '', busy: false };
    let WALLS = null;                                          // 🖼️ 배경화면 목록 [{ no, name, kind }] (다이어리에 보이는 것 · 서버 ?action=walls)
    const wallLabel = n => { const w = (WALLS || []).find(x => x.no === n), pc = n >= 1000, num = pc ? n - 1000 : n; return `${pc ? '💻' : '📱'} ${num}번${w ? ' ' + w.name : ''}`; };
    async function wallsLoad() {
        for (let i = 0; i < 3 && !WALLS; i++) {
            try { const r = await (await fetch(API + '?action=walls')).json(); if (r && r.ok && Array.isArray(r.items)) WALLS = r.items.map(x => ({ no: x.no, n: x.n, name: x.name, kind: x.kind })).sort((a, b) => a.no - b.no); } catch (e) {}
        }
    }
    const IN = { tdays: 'gTd', pdays: 'gPd', sdays: 'gSd' }, CH = { tdays: 'chipsT', pdays: 'chipsP', sdays: 'chipsSd' };
    const num = (id, max) => Math.max(0, Math.min(max, Math.floor(+($(id) && $(id).value) || 0)));
    async function giveOpen(i, mode) {
        if (!st.list[i]) return;
        Object.assign(gv, { i, code: st.list[i].code, mode: mode || 'item', coins: 0, tsel: [], tdays: 30, psel: [], pdays: 30, sdays: 30, sel: [], wsel: [], rid: '', busy: false });
        if (gv.mode === 'wall' && !WALLS) { pop('<div class="state"><span class="spin" style="border-color:rgba(194,69,111,.25);border-top-color:var(--deep)"></span><br><br>배경화면 목록을 불러오는 중…</div>'); await wallsLoad(); }
        giveForm();
    }
    function giveForm() {
        const m = st.list[gv.i] || { code: gv.code }, wall = gv.mode === 'wall';
        const dayChips = (key) => DAY_CHIPS.map(d => `<button type="button" class="chip ${gv[key] === d ? 'on' : ''}" onclick="gSet('${key}', ${d})">${d}일</button>`).join('');
        const pick = (kind, list) => ['all'].concat(list.map(x => x[0])).map(id => `<button type="button" class="chip st ${gv[kind].includes(id) ? 'on' : ''}" onclick="gPick('${kind}', '${id}')">${id === 'all' ? '🌈 전체' : esc(nameOf(list, id))}</button>`).join('');
        const days = (key, inId, chipId) => `<div class="g-num" style="margin-top:10px"><input id="${inId}" type="number" inputmode="numeric" min="1" max="365" value="${gv[key] || ''}" placeholder="30" oninput="gRead(); gChips('${key}')"><span>일 동안</span></div>
            <div class="chips" id="${chipId}">${dayChips(key)}</div>`;
        const items = `
          <div class="g-row"><h4>🪙 코인 <small>랜덤박스에서 쓰는 코인</small></h4>
            <div class="g-num"><input id="gCoins" type="number" inputmode="numeric" min="0" max="99" value="${gv.coins || ''}" placeholder="0" oninput="gRead()"><span>개</span></div></div>
          <div class="g-row"><h4>🎀 마스킹테이프 <small>전체 또는 골라서 · 안 줄 거면 비워 두세요</small></h4>
            <div class="chips">${pick('tsel', TAPES)}</div>${days('tdays', 'gTd', 'chipsT')}</div>
          <div class="g-row"><h4>🍬 달콤패턴 <small>전체 또는 골라서 · 안 줄 거면 비워 두세요</small></h4>
            <div class="chips">${pick('psel', PATS)}</div>${days('pdays', 'gPd', 'chipsP')}</div>
          <div class="g-row"><h4>🎁 캡슐 스티커 <small>여러 개 골라도 돼요</small></h4>
            <div class="chips">${STICKERS.map(([id, nm]) => `<button type="button" class="chip st ${gv.sel.includes(id) ? 'on' : ''}" onclick="gPick('sel', '${id}')">${esc(nm)}</button>`).join('')}</div>
            ${days('sdays', 'gSd', 'chipsSd')}</div>
          <p class="hint" style="margin:0 2px 10px">⏱ 기간은 <b>원래 남은 기간 뒤에 더해져요</b> (이미 가진 건 늘어나요)</p>`;
        const walls = `
          <div class="g-row"><h4>🖼️ 배경화면 <small>골라서 주면 드라이브 링크가 자동으로 가요</small></h4>
            ${WALLS === null ? '<p class="hint" style="margin:0">목록을 못 불러왔어요 (인터넷 확인 후 닫고 다시 열어 주세요)</p>'
              : !WALLS.length ? '<p class="hint" style="margin:0">다이어리에 보이는 배경화면이 아직 없어요</p>'
              : `<div class="chips" style="margin-top:0">${WALLS.map(w => `<button type="button" class="chip st ${gv.wsel.includes(w.no) ? 'on' : ''} ${(m.walls || []).includes(w.no) ? 'own' : ''}" onclick="gWall(${w.no})">${w.kind === 'pc' ? '💻' : '📱'} ${w.n || w.no}. ${esc(w.name)}${(m.walls || []).includes(w.no) ? ' ✓' : ''}</button>`).join('')}</div>
                 <p class="hint" style="margin:8px 0 0">✓ = 이미 준 배경화면 (다시 주면 링크가 도착 창에 한 번 더 떠요)</p>`}</div>`;
        pop(`<div class="g-who">${wall ? '🖼️ 배경화면 주기' : '🎁 아이템 주기'}<b>${esc(m.code)}</b></div>
          ${wall ? walls : items}
          <p class="err" id="gErr" hidden></p>
          <div class="pop-btns"><button class="btn ${wall ? 'wall' : 'gift'}" type="button" onclick="giveConfirm()">다음 · 확인하기</button>
            <button class="btn sub" type="button" onclick="unpop()">닫기</button></div>`);
        document.querySelector('.pop-box').classList.add('wide');
    }
    function gRead() { if (gv.mode === 'wall') return; gv.coins = num('gCoins', 99); gv.tdays = num('gTd', 365); gv.pdays = num('gPd', 365); gv.sdays = num('gSd', 365); }
    function gSet(key, d) { gRead(); gv[key] = d; $(IN[key]).value = d; gChips(key); }
    function gChips(key) {                                     // 눌린 기간 칸 표시만 다시 (입력 칸은 그대로)
        gRead();
        [...$(CH[key]).children].forEach((b, k) => b.classList.toggle('on', gv[key] === DAY_CHIPS[k]));
    }
    function gWall(no) { const a = gv.wsel, k = a.indexOf(no); if (k >= 0) a.splice(k, 1); else a.push(no); giveForm(); }
    function gPick(kind, id) {                                 // 🌈 전체를 고르면 개별은 풀리고, 개별을 고르면 전체가 풀려요
        gRead();
        const a = gv[kind], k = a.indexOf(id);
        if (k >= 0) a.splice(k, 1);
        else if (id === 'all') a.splice(0, a.length, 'all');
        else { const j = a.indexOf('all'); if (j >= 0) a.splice(j, 1); a.push(id); }
        giveForm();
    }
    const gNames = (ids, list) => ids.map(id => id === 'all' ? '전체' : esc(nameOf(list, id))).join(' · ');
    function giveSummary() {
        const rows = [];
        if (gv.mode === 'wall') {
            if (gv.wsel.length) rows.push(`🖼️ 배경화면 <b>${gv.wsel.length}개</b><br><small>${gv.wsel.slice().sort((a, b) => a - b).map(n => esc(wallLabel(n))).join(' · ')}</small>`);
            return rows;
        }
        if (gv.coins) rows.push(`🪙 코인 <b>${gv.coins}개</b>`);
        if (gv.tsel.length) rows.push(`🎀 마스킹테이프 <b>${gv.tsel[0] === 'all' ? '전체' : gv.tsel.length + '개'}</b> · <b>${gv.tdays}일</b>${gv.tsel[0] === 'all' ? '' : `<br><small>${gNames(gv.tsel, TAPES)}</small>`}`);
        if (gv.psel.length) rows.push(`🍬 달콤패턴 <b>${gv.psel[0] === 'all' ? '전체' : gv.psel.length + '개'}</b> · <b>${gv.pdays}일</b>${gv.psel[0] === 'all' ? '' : `<br><small>${gNames(gv.psel, PATS)}</small>`}`);
        if (gv.sel.length) rows.push(`🎁 캡슐 스티커 <b>${gv.sel.length}개</b> · 각 <b>${gv.sdays}일</b><br><small>${gv.sel.map(id => esc(STICKERS.find(x => x[0] === id)[1])).join(' · ')}</small>`);
        return rows;
    }
    function giveConfirm() {
        gRead();
        const wall = gv.mode === 'wall';
        const bad = wall ? (!gv.wsel.length ? '줄 배경화면을 하나 이상 골라 주세요' : '')
            : (!gv.coins && !gv.tsel.length && !gv.psel.length && !gv.sel.length) ? '줄 아이템을 하나 이상 골라 주세요'
            : (gv.tsel.length && gv.tdays < 1) ? '마스킹테이프 기간(일)을 적어 주세요'
            : (gv.psel.length && gv.pdays < 1) ? '달콤패턴 기간(일)을 적어 주세요'
            : (gv.sel.length && gv.sdays < 1) ? '스티커 기간(일)을 적어 주세요' : '';
        if (bad) { $('gErr').textContent = bad; $('gErr').hidden = false; return; }
        gv.rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);       // 이 선물의 요청 번호 (다시 보내도 한 번만)
        pop(`<div class="pop-t" style="text-align:center">이렇게 줄까요?</div>
          <div class="g-sum"><b>${esc(gv.code)}</b> 에게<br>${giveSummary().join('<br>')}</div>
          <div class="pop-btns"><button class="btn ${wall ? 'wall' : 'gift'}" type="button" onclick="giveSend()">${wall ? '🖼️' : '🎁'} 보내기</button>
            <button class="btn sub" type="button" onclick="giveForm()">← 고치기</button></div>`);
    }
    async function giveSend() {
        if (gv.busy) return;
        gv.busy = true;
        const code = gv.code, wall = gv.mode === 'wall';
        pendSet({ kind: 'give', code, gv: Object.assign({}, gv, { busy: false }) });       // 결과 창이 뜰 때까지 지우지 않아요 (앱이 닫혀도 이어서 확인)
        pop(`<div class="state"><span class="spin" style="border-color:rgba(194,69,111,.25);border-top-color:var(--deep)"></span><br><br>선물을 보내는 중…</div>`);
        const body = wall ? { walls: gv.wsel } : { coins: gv.coins, tapes: gv.tsel, tdays: gv.tdays, pats: gv.psel, pdays: gv.pdays, stickers: gv.sel, sdays: gv.sdays };
        let r = { ok: false, error: 'network' }, ok = false;
        try {
            r = await api(Object.assign({ action: 'admin_give', code, rid: gv.rid }, body), 4, 45000);   // 같은 rid 라 몇 번 보내도 한 번만
            ok = !!r.ok;
            const reread = async () => { const f = await api({ action: 'admin_find', q: code }, 3); const now = f.ok ? (f.list || []).find(x => x.code === code) : null; const k = st.list.findIndex(x => x.code === code); if (now && k >= 0) st.list[k] = Object.assign({}, st.list[k], now); return now; };
            if (ok && !wall && (gv.tsel.length || gv.psel.length)) {   // 🎀 · 🍬 는 시트를 다시 읽어서 맞는지 확인
                const now = await reread();
                const same = (all, one, res) => !res || ((!res.all || all === res.all) && Object.keys(res.ids || {}).every(id => (one || {})[id] === res.ids[id]));
                ok = !!now && same(now.tape, now.tp, r.tape) && same(now.pat, now.pp, r.pat);
            }
            if (ok && wall) {                                          // 🖼️ 배경화면도 시트(배경화면 지급 탭)를 다시 읽어서 맞는지 확인
                const now = await reread();
                ok = !!now && gv.wsel.every(n => (now.walls || []).includes(n));
            }
        } catch (e) { ok = false; }
        gv.busy = false;
        if (ok || ['none', 'key', 'setup', 'bad', 'nofolder'].includes(r.error)) pendClear();   // 처리됐거나 처음부터 안 되는 건 기록을 지워요 · 불안한 건 남겨 둬요
        try { ok ? giveOk(r) : giveBad(r); render(); }
        catch (e) { pop('<div class="pop-ic bad">!</div><div class="pop-t">결과를 보여 주지 못했어요</div><div class="pop-s">앱을 다시 열면 \'이어서 확인하기\' 창이 떠요.</div><div class="pop-btns"><button class="btn sub" type="button" onclick="unpop()">닫기</button></div>'); }
    }
    function passDone(ic, res, list, days) {                    // 받은 디자인마다 끝나는 날 + '원래 + 새 기간'
        if (!res) return '';
        return (res.all ? [`<br>${ic} 🌈 전체 <b>${md(res.all)}</b>까지 (${dLeft(res.all)})${addLine(res.allFrom, days, res.all)}`] : [])
            .concat(Object.keys(res.ids || {}).map(id => `<br>${ic} ${esc(nameOf(list, id))} <b>${md(res.ids[id])}</b>까지 (${dLeft(res.ids[id])})${addLine((res.from || {})[id], days, res.ids[id])}`)).join('');
    }
    function stickDone(r) {                                     // 🎁 스티커마다 끝나는 날 · 🪙 코인 (더한 개수 → 지금 개수)
        const got = r.got || {};
        return Object.keys(got).map(id => `<br>🎁 ${esc((STICKERS.find(x => x[0] === id) || [id, id])[1])} <b>${md(got[id].until)}</b>까지 (${dLeft(got[id].until)})${addLine(got[id].from, r.sdays, got[id].until)}`).join('');
    }
    function giveOk(r) {
        const wall = gv.mode === 'wall';
        pop(`<div class="pop-ic">✓</div><div class="pop-t" style="text-align:center">선물 완료!</div>
          <div class="pop-d"><b>${esc(r.code)}</b><br>${giveSummary().join('<br>')}
            ${!wall && r.coins != null ? `<br>🪙 코인 <b>+${r.added || gv.coins}개</b> → 지금 <b>${r.coins}개</b>` : ''}${wall ? '' : passDone('🎀', r.tape, TAPES, gv.tdays) + passDone('🍬', r.pat, PATS, gv.pdays) + stickDone(r)}</div>
          <div class="pop-s" style="font-size:12.5px;text-align:center">${SENT}${wall ? '<br>🖼️ 배경화면은 알림 창에 링크가 붙어 있고 · 📱 배경화면 → 받기 에서도 볼 수 있어요' : ''}</div>
          <div class="pop-btns"><button class="btn" type="button" onclick="unpop()">닫기</button></div>`);
    }
    function giveBad(r) {
        const why = r.error === 'key' ? '관리 열쇠가 맞지 않아요.' : r.error === 'none' ? '그 저금 코드를 시트에서 찾지 못했어요.'
            : r.error === 'nofolder' ? `드라이브에서 <b>${esc(r.path || '배경화면 폴더')}</b> 폴더를 찾지 못했어요.<br>내 드라이브에 이 경로의 폴더가 있는지 확인해 주세요. (아무것도 보내지 않았어요)`
            : r.error === 'setup' ? '회원 서버에 랜덤박스 연결(GACHA_API_URL · GACHA_KEY)이 아직 안 되어 있어요.'
            : r.error === 'gacha' ? '🪙 코인 · 🎁 스티커를 랜덤박스 서버에 전하지 못했어요.' + (r.tape || r.pat ? '<br>(🎀 · 🍬 는 이미 들어갔어요)' : '')
            : r.ok ? '보냈는데 시트에서 확인하지 못했어요.' : '인터넷이 불안해서 서버에 닿지 못했어요.';
        const retry = !(r.error === 'none' || r.error === 'key' || r.error === 'setup' || r.error === 'bad' || r.error === 'nofolder');
        pop(`<div class="pop-ic bad">!</div><div class="pop-t" style="text-align:center">아직 완료되지 않았어요</div>
          <div class="pop-s" style="text-align:center">${why}<br><small>${retry ? '<b>다시 시도</b>는 같은 요청이라 이미 들어간 건 두 번 들어가지 않아요.' : ''}</small></div>
          <div class="pop-btns">${retry ? '<button class="btn" type="button" onclick="giveSend()">다시 시도</button>' : ''}
            <button class="btn sub" type="button" onclick="unpop()">닫기</button></div>`);
    }

    /* ---------- 📲 홈 화면에 설치 (숨김 : 로고 5번) ---------- */
    let installEv = null, taps = 0, tapT = 0;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; });
    $('logo').addEventListener('click', () => {
        clearTimeout(tapT); tapT = setTimeout(() => { taps = 0; }, 1500);
        if (++taps < 5) return;
        taps = 0; showInstall();
    });
    function showInstall() {
        const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
        $('installBody').innerHTML = standalone ? '<p>✅ 이미 앱으로 열려 있어요. 홈 화면에 아이콘이 있어요!</p>'
            : installEv ? '<p>버튼을 누르고 <b>설치</b>를 누르면 홈 화면에 <b>저금 확인</b> 아이콘이 생겨요.</p><button class="btn" type="button" onclick="doInstall()" style="margin-bottom:8px">📲 홈 화면에 설치</button>'
            : ios ? '<ol><li><b>사파리</b>로 이 페이지를 열어요</li><li>아래쪽 <b>공유 버튼(□↑)</b>을 눌러요</li><li><b>홈 화면에 추가</b> → <b>추가</b></li></ol>'
            : '<ol><li>크롬 오른쪽 위 <b>⋮</b> 를 눌러요</li><li><b>홈 화면에 추가</b> (또는 <b>앱 설치</b>) → <b>설치</b></li></ol>';
        $('install').hidden = false;
    }
    async function doInstall() {
        if (!installEv) return showInstall();
        installEv.prompt();
        try { await installEv.userChoice; } catch (e) {}
        installEv = null; $('install').hidden = true;
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});   // 앱 설치용 (다이어리와 같은 서비스 워커)
    showMain();
</script>
</body>
</html>
